name: Deploy backend a Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'recommender.py'
      - 'Dockerfile'
      - 'requirements.txt'
  workflow_dispatch:          # botón manual

permissions:
  id-token: write             # para OIDC login a Azure
  contents: read

env:
  IMAGE_NAME: priceiq-backend
  AZURE_RG:   ${{ vars.AZURE_RG }}      # ej. priceiq-rg
  AZURE_ACR:  ${{ vars.AZURE_ACR }}     # ej. priceiq12345
  AZURE_APP:  ${{ vars.AZURE_APP }}     # ej. priceiq-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build & push imagen vía ACR Tasks
        run: |
          TAG="${GITHUB_SHA::8}"
          az acr build \
            --registry "$AZURE_ACR" \
            --image "${IMAGE_NAME}:${TAG}" \
            --image "${IMAGE_NAME}:latest" \
            --file Dockerfile .
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

      - name: Deploy nueva imagen a Container Apps
        run: |
          az containerapp update \
            --name "$AZURE_APP" \
            --resource-group "$AZURE_RG" \
            --image "${AZURE_ACR}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Verificar healthcheck
        run: |
          URL=$(az containerapp show -n "$AZURE_APP" -g "$AZURE_RG" \
                --query properties.configuration.ingress.fqdn -o tsv)
          echo "Healthcheck en https://$URL/api/health"
          for i in {1..30}; do
            STATUS=$(curl -fs "https://$URL/api/health" | jq -r '.status' 2>/dev/null || echo "down")
            echo "  intento $i: $STATUS"
            [[ "$STATUS" == "ok" ]] && exit 0
            sleep 10
          done
          echo "❌ Healthcheck falló después de 5 min"
          exit 1
